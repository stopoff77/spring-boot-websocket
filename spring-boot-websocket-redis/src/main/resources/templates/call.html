<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Call Test</title>
    <!-- SockJS 및 STOMP 클라이언트 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        .btn { padding: 8px 16px; margin-right: 5px; cursor: pointer; }
        .btn-connect { background-color: #4CAF50; color: white; border: none; }
        .btn-end { background-color: #f44336; color: white; border: none; }
        .btn-secondary { background-color: #008CBA; color: white; border: none; }
    </style>
</head>
<body>
    <h2>웹소켓 사용자 등록 및 통화(연결/종료) 테스트</h2>

    <div>
        <h3>1. 본인 및 통화 대상 정보</h3>
        <label>내 ID (userId): </label>
        <input type="text" id="userId" value="userA" /><br/>
        <label>내 이름 (userName): </label>
        <input type="text" id="userName" value="홍길동" /><br/><br/>

        <label>상대방 ID (receiverId): </label>
        <input type="text" id="receiverId" value="userB" /><br/><br/>

        <button class="btn btn-secondary" onclick="connectAndInit()">웹소켓 연결 & 사용자 등록</button>
        <button class="btn btn-secondary" onclick="disconnect()">웹소켓 연결 해제</button>
    </div>

    <hr/>

    <div>
        <h3>2. 통화 제어</h3>
        <button class="btn btn-connect" onclick="sendCallConnect()">📞 통화 연결 요청</button>
        <button class="btn btn-end" onclick="sendCallEnd()">🛑 통화 종료</button>
    </div>

    <hr/>

    <h3>실행 로그</h3>
    <div id="log" style="border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; background: #f9f9f9;"></div>

    <script>
        let stompClient = null;

        // 1. 웹소켓 연결 및 사용자 정보 등록 (/pub/user/init)
        function connectAndInit() {
            const userId = document.getElementById('userId').value;
            const userName = document.getElementById('userName').value;

            if (!userId) {
                alert('내 ID(userId)를 입력하세요.');
                return;
            }

            const socket = new SockJS('http://localhost:8080/ws-for-app');
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function (frame) {
                logMessage('✔ 웹소켓 연결 성공 (STOMP Connected)');

                // [Step 1] 연결 성공 직후 사용자 정보를 서버로 전송 (/pub/user/init)
                const userInfoPayload = {
                    userId: userId,
                    userName: userName,
                    deviceType: 'WEB'
                };
                stompClient.send('/pub/user/init', {}, JSON.stringify(userInfoPayload));
                logMessage(`[서버 등록 완료] 사용자 정보 전송: ${JSON.stringify(userInfoPayload)}`);

                // [Step 2] 내 전용 통화 알림 채널 구독 (/sub/call/{userId})
                stompClient.subscribe('/sub/call/' + userId, function (response) {
                    const callData = JSON.parse(response.body);
                    logMessage(`🔔 [신호 수신] 타입: ${callData.type} | 발신자: ${callData.callerId} | 메시지: ${callData.message}`);
                });

                logMessage(`📡 개인 채널 구독 완료: /sub/call/${userId}`);

            }, function (error) {
                logMessage('❌ ERROR: 웹소켓 연결 실패 - ' + error);
            });
        }

        // 2. 통화 연결 버튼 클릭
        function sendCallConnect() {
            if (!checkConnected()) return;

            const callerId = document.getElementById('userId').value;
            const receiverId = document.getElementById('receiverId').value;

            const payload = {
                callerId: callerId,
                receiverId: receiverId,
                type: 'CONNECT',
                message: `${callerId}님이 통화 연결을 요청했습니다.`
            };

            // /pub/call/connect 로 전송
            stompClient.send('/pub/call/connect', {}, JSON.stringify(payload));
            logMessage(`📞 [통화 연결 송신] -> ${receiverId}`);
        }

        // 3. 통화 종료 버튼 클릭
        function sendCallEnd() {
            if (!checkConnected()) return;

            const callerId = document.getElementById('userId').value;
            const receiverId = document.getElementById('receiverId').value;

            const payload = {
                callerId: callerId,
                receiverId: receiverId,
                type: 'END',
                message: `${callerId}님이 통화를 종료했습니다.`
            };

            // /pub/call/end 로 전송
            stompClient.send('/pub/call/end', {}, JSON.stringify(payload));
            logMessage(`🛑 [통화 종료 송신] -> ${receiverId}`);
        }

        // 4. 연결 해제
        function disconnect() {
            if (stompClient !== null && stompClient.connected) {
                stompClient.disconnect(function () {
                    logMessage('🔌 DISCONNECTED: 웹소켓 연결이 해제되었습니다.');
                });
            }
        }

        // 연결 체크 유틸
        function checkConnected() {
            if (!stompClient || !stompClient.connected) {
                alert('먼저 웹소켓을 연결해주세요.');
                return false;
            }
            return true;
        }

        // 로그 출력 함수
        function logMessage(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
    </script>
</body>
</html>
