<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WebSocket User Init Test</title>
    <!-- SockJS 및 STOMP 클라이언트 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
    <h2>웹소켓 연결 및 사용자 정보 초기화 예제</h2>

    <div>
        <label>사용자 ID (userId): </label>
        <input type="text" id="userId" value="user123" /><br/>
        <label>사용자 이름 (userName): </label>
        <input type="text" id="userName" value="홍길동" /><br/><br/>

        <button onclick="connectAndInit()">웹소켓 연결 & 정보 전송</button>
        <button onclick="disconnect()">연결 해제</button>
    </div>

    <hr/>
    <h3>실행 로그</h3>
    <div id="log" style="border: 1px solid #ccc; height: 250px; overflow-y: scroll; padding: 10px; background: #f9f9f9;"></div>

    <script>
        let stompClient = null;

        function connectAndInit() {
            const userId = document.getElementById('userId').value;
            const userName = document.getElementById('userName').value;

            if (!userId) {
                alert('userId를 입력하세요.');
                return;
            }

            // 1. 웹소켓 엔드포인트 연결
            const socket = new SockJS('http://localhost:8080/ws-for-app');
            stompClient = Stomp.over(socket);

            // ★ [핵심 수정] STOMP CONNECT 프레임에 담아 보낼 헤더 정의
            const connectHeaders = {
                'userId': userId,
                'userName' : userName
                // Authorization: 'Bearer ' + token // 만약 JWT 토큰을 쓰신다면 여기서 전달
            };

            // STOMP 연결 요청
            stompClient.connect(connectHeaders, function (frame) {
                logMessage('1. 웹소켓 연결 성공 (STOMP Connected): ' + frame);

                // 2. [핵심] 연결 성공 직후 /pub/user/init 으로 사용자 정보 전송
                const userInfoPayload = {
                    userId: userId,
                    userName: userName,
                    deviceType: 'WEB' // 필요 시 앱/웹 구분값 등
                };

                // 서버의 @MessageMapping("/user/init")으로 매핑됨 (ApplicationDestinationPrefix가 /pub 인 경우)
                stompClient.send('/pub/user/init', {}, JSON.stringify(userInfoPayload));
                logMessage(`2. 서버로 사용자 정보 전송 완료: ${JSON.stringify(userInfoPayload)}`);

                // 3. 필요 시 개인 채널 구독 (/sub/user/{userId})
                stompClient.subscribe('/sub/user/' + userId, function (response) {
                    logMessage('개인 메시지 수신: ' + response.body);
                });

            }, function (error) {
                logMessage('ERROR: 웹소켓 연결 실패 - ' + error);
            });
        }

        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect(function () {
                    logMessage('DISCONNECTED: 웹소켓 연결이 종료되었습니다.');
                });
            }
        }

        function logMessage(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
    </script>
</body>
</html>
